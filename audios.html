 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audios - ASAMBLEA DE DIOS EL EDÉN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

body {
    margin: 0;
    padding: 0;
    background-image: url("fondo.jpeg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
}

.contenedor {
    max-width: 900px;
    margin: 50px auto;
    padding: 25px;
    background: rgba(0,0,0,0.65);
    border: 2px solid gold;
    box-shadow: 0 0 20px gold;
    border-radius: 10px;
}

h1 {
    text-align: center;
    color: gold;
    font-size: 3rem;
    text-shadow: 0 0 20px gold;
}

/* TEXTO INTRO */
h2 {
    text-align: center;
    font-size: 1.3rem;
    margin-top: 20px;
    background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgbText 6s linear infinite;
}
@keyframes rgbText {
    0% {background-position: 0% 50%;}
    100% {background-position: 100% 50%;}
}

/* ================= AUDIO BOX ================= */
.audio-box {
    --progress: 0%;
    --color: #00ff66;

    position: relative;
    margin-bottom: 30px;
    padding: 22px;
    border-radius: 12px;
    background: rgba(0,0,0,0.55);
    overflow: hidden;
}

/* RELLENO HUD (TODO EL CUADRO) */
 .audio-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: var(--progress);
    background: linear-gradient(
        90deg,
        var(--color),
        #ffffffaa,
        var(--color)
    );
    opacity: 0.55; /* MÁS FUERTE */
    filter: brightness(1.6) saturate(1.6);
    transition: width 0.2s linear, background 0.3s;
    z-index: 0;
}


/* CONTENIDO POR ENCIMA */
 .audio-box {
    border: 2px solid #00ff66;
    box-shadow:
        0 0 10px #00ff66,
        0 0 20px #00ff66,
        inset 0 0 10px rgba(0,255,102,0.4);
}


/* TITULO NORMAL */
.audio-box strong {
    display: block;
    margin-bottom: 6px;
    color: #fff;
}

/* TITULO HACKER (SOLO CUANDO REPRODUCE) */
.audio-box .titulo-hacker {
    display: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    letter-spacing: 3px;
    margin-bottom: 6px;

    background: linear-gradient(90deg,#00ffcc,#00ff00,#00ccff,#00ffcc);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: hackerRGB 2s linear infinite, blink 1.2s infinite;
    text-shadow: 0 0 12px #00ffcc;
}

 .audio-box.activo {
    box-shadow:
        0 0 15px var(--color),
        0 0 35px var(--color),
        inset 0 0 18px var(--color);
}

.audio-box.activo strong {
    display: none;
}

@keyframes hackerRGB {
    0% {background-position: 0% 50%;}
    100% {background-position: 100% 50%;}
}
@keyframes blink {
    0%,100% {opacity: 1;}
    50% {opacity: 0.6;}
}

audio {
    width: 100%;
}

.volver {
    text-align: center;
    margin-top: 30px;
}
.volver a {
    color: gold;
    font-size: 1.4rem;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="contenedor">
<h1>🎧 Audios</h1>

<h2>Dios te bendiga, acá puedes reproducir cantos, textos bíblicos y testimonios.</h2>

<!-- ===== AUDIO ===== -->
<div class="audio-box">
    <div class="titulo-hacker">TESTIMONIO DE UN JOVEN</div>
    <strong>Testimonio de un joven</strong>
    <audio controls src="testimonio.mp3"></audio>
</div>

<div class="audio-box">
    <div class="titulo-hacker">APOCALIPSIS</div>
    <strong>Apocalipsis</strong>
    <audio controls src="DOS .mp3"></audio>
</div>

<div class="audio-box">
    <div class="titulo-hacker">COROS DE FUEGO</div>
    <strong>Coros de fuego</strong>
    <audio controls src="Coros de fuego.mp3"></audio>
</div>

<div class="volver">
    <a href="index.html">⬅ Volver al inicio</a>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const audios = document.querySelectorAll("audio");

    audios.forEach(audio => {
        const box = audio.closest(".audio-box");

        audio.addEventListener("play", () => {
            // Solo un audio activo
            audios.forEach(a => { if (a !== audio) a.pause(); });
            document.querySelectorAll(".audio-box").forEach(b => b.classList.remove("activo"));
            box.classList.add("activo");
        });

        audio.addEventListener("timeupdate", () => {
            if (!audio.duration) return;

            const p = (audio.currentTime / audio.duration) * 100;
            let color = "#00ff66";       // verde

            if (p > 75) color = "#ff3333";      // rojo
            else if (p > 50) color = "#ffaa00"; // naranja
            else if (p > 25) color = "#00ccff"; // azul

            box.style.setProperty("--progress", p + "%");
            box.style.setProperty("--color", color);
        });

        audio.addEventListener("pause", () => {
            box.classList.remove("activo");
        });

        audio.addEventListener("ended", () => {
            box.classList.remove("activo");
            box.style.setProperty("--progress", "0%");
        });
    });
});
</script>

</body>
</html>
