 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audios - ASAMBLEA DE DIOS EL EDÉN</title>

<style>
body {
    margin: 0;
    padding: 0;
    background-image: url("fondo.jpeg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
}

.contenedor {
    max-width: 900px;
    margin: 50px auto;
    padding: 25px;
    background: rgba(0,0,0,0.6);
    border: 2px solid gold;
    box-shadow: 0 0 20px gold;
    border-radius: 10px;
}

h1 {
    text-align: center;
    color: gold;
    font-size: 3rem;
    text-shadow: 0 0 20px gold;
}

/* TEXTO INTRO RGB */
h2 {
    font-size: 1.3rem;
    text-align: center;
    font-weight: bold;
    margin-top: 25px;
    background: linear-gradient(90deg,red,orange,yellow,green,cyan,blue,violet,red);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgbText 6s linear infinite;
}
@keyframes rgbText {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
}

/* AUDIO BOX */
.audio-box {
    margin-bottom: 25px;
    background: rgba(0,255,100,0.08);
    padding: 20px;
    border-left: 4px solid #00ff66;
    box-shadow: 0 0 10px #00ff66;
    border-radius: 10px;
}

audio { width: 100%; }

/* BARRA DE PROGRESO */
.progress {
    width: 100%;
    height: 8px;
    background: #111;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 10px;
    display: none;
}
.progress-bar {
    height: 100%;
    width: 0%;
    transition: width 0.2s linear;
}

/* VISOR CENTRAL */
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

#audio-visor {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    transition: opacity .3s;
}
#audio-visor.activo { opacity: 1; }

#audio-visor span {
    font-family: 'Share Tech Mono', monospace;
    font-size: 34px;
    letter-spacing: 4px;
    background: linear-gradient(90deg,#00ffcc,#00ff00,#00ccff,#00ffcc);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: visorRGB 2s linear infinite, blink 1.2s infinite;
    text-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
}
@keyframes visorRGB {
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
}
@keyframes blink {
    0%,100%{opacity:1;}
    50%{opacity:.6;}
}

/* LINEA HACKER */
.linea-hacker {
    width: 100%;
    height: 5px;
    background: black;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    margin: 40px 0 15px;
    box-shadow: 0 0 20px rgba(0,255,255,.4);
}
.linea-hacker::before {
    content:"";
    position:absolute;
    top:0;
    left:-30%;
    width:30%;
    height:100%;
    background:linear-gradient(90deg,transparent,#00ffff,transparent);
    animation:scan 1.3s linear infinite;
}
@keyframes scan {
    0%{left:-30%;}
    100%{left:100%;}
}
.texto-hacker {
    font-family:'Share Tech Mono',monospace;
    font-size:26px;
    text-align:center;
    letter-spacing:3px;
    animation:rgbtext2 2.2s linear infinite;
}
@keyframes rgbtext2 {
    0%{color:#00ffff;text-shadow:0 0 10px #00ffff;}
    33%{color:#00ff00;text-shadow:0 0 10px #00ff00;}
    66%{color:#ff00ff;text-shadow:0 0 10px #ff00ff;}
    100%{color:#00ffff;text-shadow:0 0 10px #00ffff;}
}

.volver {
    text-align:center;
    margin-top:30px;
}
.volver a {
    color:gold;
    font-size:1.4rem;
    text-decoration:none;
}
</style>
</head>

<body>

<!-- VISOR CENTRAL -->
<div id="audio-visor"><span id="audio-titulo"></span></div>

<div class="contenedor">
<h1>🎧 Audios</h1>

<h2>Dios te bendiga, acá puedes reproducir cantos, textos bíblicos y testimonios.</h2>

<!-- EJEMPLO DE AUDIO (COPIA ESTE BLOQUE PARA TODOS) -->
<div class="audio-box">
    <strong>Testimonio de un joven</strong>
    <audio controls src="testimonio.mp3"></audio>
    <div class="progress"><div class="progress-bar"></div></div>
</div>

<div class="audio-box">
    <strong>Apocalipsis</strong>
    <audio controls src="DOS .mp3"></audio>
    <div class="progress"><div class="progress-bar"></div></div>
</div>

<div class="linea-hacker"></div>
<div class="texto-hacker">SEGUNDA TEMPORADA</div>

<div class="audio-box">
    <strong>Coros de fuego</strong>
    <audio controls src="Coros de fuego.mp3"></audio>
    <div class="progress"><div class="progress-bar"></div></div>
</div>

<div class="volver">
    <a href="index.html">⬅ Volver al inicio</a>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const audios = document.querySelectorAll("audio");
    const visor = document.getElementById("audio-visor");
    const titulo = document.getElementById("audio-titulo");

    audios.forEach(audio => {
        const box = audio.closest(".audio-box");
        const bar = box.querySelector(".progress-bar");
        const progress = box.querySelector(".progress");
        const nombre = box.querySelector("strong").innerText;

        audio.addEventListener("play", () => {
            audios.forEach(a => { if (a !== audio) a.pause(); });

            document.querySelectorAll(".progress").forEach(p => p.style.display="none");
            progress.style.display = "block";

            titulo.textContent = nombre.toUpperCase();
            visor.classList.add("activo");
        });

        audio.addEventListener("timeupdate", () => {
            const p = (audio.currentTime / audio.duration) * 100;
            bar.style.width = p + "%";

            if (p <= 25) bar.style.background = "#00ff66";
            else if (p <= 50) bar.style.background = "#00ccff";
            else if (p <= 75) bar.style.background = "#ffaa00";
            else bar.style.background = "#ff3333";
        });

        audio.addEventListener("ended", () => {
            bar.style.width = "0%";
            progress.style.display = "none";
            visor.classList.remove("activo");
        });

        audio.addEventListener("pause", () => {
            visor.classList.remove("activo");
        });
    });
});
</script>

</body>
</html>
