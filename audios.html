 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audios - ASAMBLEA DE DIOS EL EDÉN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

body {
    margin: 0;
    padding: 0;
    background-image: url("fondo.jpeg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
}

.contenedor {
    max-width: 900px;
    margin: 50px auto;
    padding: 25px;
    background: rgba(0,0,0,0.6);
    border: 2px solid gold;
    box-shadow: 0 0 20px gold;
    border-radius: 10px;
}

h1 {
    text-align: center;
    color: gold;
    font-size: 3rem;
    text-shadow: 0 0 20px gold;
}

/* TITULO RGB */
h2 {
    font-size: 1.3rem;
    text-align: center;
    font-weight: bold;
    margin-top: 25px;
    background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet, red);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgbText 6s linear infinite;
}
@keyframes rgbText {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* AUDIO BOX */
.audio-box {
    margin-bottom: 25px;
    background: rgba(0,255,100,0.08);
    padding: 20px;
    border-left: 4px solid #00ff66;
    border-radius: 10px;
    position: relative;
}

audio { width: 100%; }

/* BARRA DE PROGRESO */
.progreso {
    width: 100%;
    height: 8px;
    background: #111;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 10px;
}

.progreso span {
    display: block;
    height: 100%;
    width: 0%;
    background: lime;
    transition: width 0.3s linear, background 0.3s linear;
}

/* VISOR CENTRAL */
#audio-visor {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.4s ease;
}

#audio-visor.activo { opacity: 1; }

#audio-titulo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 38px;
    letter-spacing: 4px;
    text-align: center;
    background: linear-gradient(90deg,#00ffcc,#00ff00,#00ccff,#00ffcc);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: visorRGB 2s linear infinite, blink 1.2s infinite;
    text-shadow: 0 0 20px #00ffcc;
}

@keyframes visorRGB {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}
@keyframes blink {
    0%,100%{opacity:1}
    50%{opacity:.6}
}

/* LINEA HACKER */
.linea-hacker {
    width: 100%;
    height: 5px;
    background: black;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    margin: 40px 0 15px;
}
.linea-hacker::before {
    content:"";
    position:absolute;
    left:-30%;
    width:30%;
    height:100%;
    background:linear-gradient(90deg,transparent,#00ffff,transparent);
    animation:scan 1.3s linear infinite;
}
@keyframes scan {
    0%{left:-30%}
    100%{left:100%}
}

.texto-hacker {
    font-family:'Share Tech Mono',monospace;
    font-size:26px;
    text-align:center;
    animation:rgbtext2 2s infinite;
}
@keyframes rgbtext2 {
    0%{color:#0ff}
    50%{color:#0f0}
    100%{color:#f0f}
}

.volver { text-align:center; margin-top:30px; }
.volver a { color:gold; font-size:1.4rem; text-decoration:none; }
</style>
</head>

<body>

<!-- VISOR -->
<div id="audio-visor"><div id="audio-titulo"></div></div>

<div class="contenedor">
<h1>🎧 Audios</h1>
<h2>Dios te bendiga, acá puedes reproducir cantos, textos bíblicos y testimonios.</h2>

<!-- EJEMPLO AUDIO (aplica a TODOS igual) -->
<div class="audio-box">
<strong>Testimonio de un joven</strong>
<audio controls>
<source src="testimonio.mp3">
</audio>
<div class="progreso"><span></span></div>
</div>

<!-- 👉 DUPLICA ESTE BLOQUE PARA TODOS TUS AUDIOS 👈 -->

<div class="volver">
<a href="index.html">⬅ Volver al inicio</a>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
const audios = document.querySelectorAll("audio");
const visor = document.getElementById("audio-visor");
const titulo = document.getElementById("audio-titulo");

audios.forEach(audio => {
const barra = audio.parentElement.querySelector(".progreso span");

audio.addEventListener("play", () => {
audios.forEach(a => { if(a!==audio){ a.pause(); } });

const nombre = audio.parentElement.querySelector("strong").innerText;
titulo.textContent = nombre.toUpperCase();
visor.classList.add("activo");
});

audio.addEventListener("timeupdate", () => {
const p = (audio.currentTime / audio.duration) * 100;
barra.style.width = p + "%";

if (p < 25) barra.style.background = "#00ff66";
else if (p < 50) barra.style.background = "#00aaff";
else if (p < 75) barra.style.background = "#ffaa00";
else barra.style.background = "#ff0033";
});

audio.addEventListener("ended", () => {
barra.style.width = "0%";
visor.classList.remove("activo");
});
audio.addEventListener("pause", () => visor.classList.remove("activo"));
});
});
</script>

</body>
</html>
