 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audios - ASAMBLEA DE DIOS EL EDÉN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

body{
    margin:0;
    background:url("fondo.jpeg") center/cover fixed;
    font-family:Arial, sans-serif;
}

.contenedor{
    max-width:900px;
    margin:50px auto;
    padding:25px;
    background:rgba(0,0,0,.65);
    border:2px solid gold;
    box-shadow:0 0 20px gold;
    border-radius:10px;
}

h1{
    text-align:center;
    color:gold;
    font-size:3rem;
    text-shadow:0 0 20px gold;
}

h2{
    text-align:center;
    font-size:1.3rem;
    background:linear-gradient(90deg,red,orange,yellow,green,cyan,blue,violet,red);
    background-size:400%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:rgbText 6s linear infinite;
}

@keyframes rgbText{
    0%{background-position:0%}
    100%{background-position:400%}
}

/* AUDIO BOX */
.audio-box{
    background:rgba(0,255,100,.08);
    padding:20px;
    margin-bottom:30px;
    border-left:4px solid #00ff66;
    border-radius:10px;
    position:relative;
}

audio{ width:100%; }

/* TITULO CENTRAL */
#visor-central{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-family:'Share Tech Mono', monospace;
    font-size:36px;
    pointer-events:none;
    opacity:0;
    z-index:9999;
    animation:rgbTitulo 2s infinite;
}

#visor-central.activo{ opacity:1; }

@keyframes rgbTitulo{
    0%{color:#66ffcc;text-shadow:0 0 15px #66ffcc}
    25%{color:#00ff00}
    50%{color:#00aaff}
    75%{color:#ff9900}
    100%{color:#ff0033}
}

/* BARRA */
.barra{
    height:8px;
    background:#111;
    border-radius:5px;
    overflow:hidden;
    margin-top:10px;
}
.barra span{
    display:block;
    height:100%;
    width:0%;
    transition:width .2s linear;
}

/* PORCENTAJE */
.porcentaje{
    font-family:'Share Tech Mono', monospace;
    text-align:right;
    font-size:14px;
    margin-top:4px;
}

/* VOLUMEN */
.volumen{
    width:100%;
    margin-top:6px;
}

.linea-hacker{
    height:5px;
    background:black;
    margin:40px 0 15px;
    overflow:hidden;
    position:relative;
}
.linea-hacker::before{
    content:"";
    position:absolute;
    width:30%;
    height:100%;
    left:-30%;
    background:linear-gradient(90deg,transparent,#00ffff,transparent);
    animation:scan 1.3s linear infinite;
}
@keyframes scan{
    from{left:-30%}
    to{left:100%}
}

.texto-hacker{
    text-align:center;
    font-family:'Share Tech Mono', monospace;
    font-size:26px;
    animation:rgbTitulo 2.2s infinite;
}

.volver{text-align:center;margin-top:30px;}
.volver a{color:gold;text-decoration:none;font-size:1.4rem;}
</style>
</head>

<body>

<div id="visor-central"></div>

<div class="contenedor">
<h1>🎧 Audios</h1>
<h2>Dios te bendiga, disfruta los audios.</h2>

<div class="audio-box">
<strong>Testimonio de un joven</strong>
<audio src="testimonio.mp3" controls></audio>
<div class="barra"><span></span></div>
<div class="porcentaje">0%</div>
<input type="range" class="volumen" min="0" max="1" step="0.01" value="1">
</div>

<div class="linea-hacker"></div>
<div class="texto-hacker">SEGUNDA TEMPORADA</div>

<div class="volver">
<a href="index.html">⬅ Volver al inicio</a>
</div>
</div>

<script>
const audios=document.querySelectorAll("audio");
const visor=document.getElementById("visor-central");

// beep digital
const beep=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");

audios.forEach(audio=>{
 const box=audio.closest(".audio-box");
 const barra=box.querySelector(".barra span");
 const porc=box.querySelector(".porcentaje");
 const vol=box.querySelector(".volumen");
 const titulo=box.querySelector("strong").innerText;

 vol.addEventListener("input",()=>audio.volume=vol.value);

 audio.addEventListener("play",()=>{
   audios.forEach(a=>{if(a!==audio)a.pause();});
   visor.innerText=titulo;
   visor.classList.add("activo");
   beep.play();
 });

 audio.addEventListener("timeupdate",()=>{
   const p=(audio.currentTime/audio.duration)*100||0;
   barra.style.width=p+"%";
   porc.innerText=Math.floor(p)+"%";

   if(p<=25){barra.style.background="#66ff99";porc.style.color="#66ff99";}
   else if(p<=50){barra.style.background="#00aaff";porc.style.color="#00aaff";}
   else if(p<=75){barra.style.background="#ff9900";porc.style.color="#ff9900";}
   else{barra.style.background="#ff0033";porc.style.color="#ff0033";}
 });

 audio.addEventListener("ended",()=>{
   barra.style.width="0%";
   porc.innerText="0%";
   visor.classList.remove("activo");
 });
});
</script>

</body>
</html>
